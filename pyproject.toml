[project]
name = "nutrient-extraction-cost"
version = "0.1.0"
description = "Measure what document extraction costs, with and without the Nutrient SDK, on your own documents"
requires-python = ">=3.10"
# One dependency, deliberately. Everything else is the standard library, so the
# list a prospect audits before running this fits on one line.
#
# The floor is not housekeeping. Up to 1.0.10.1 the SDK's logprobs handling
# corrupted a local runtime's answer (NAVI-39), and this tool carried a proxy
# strip to compensate. 1.0.11 fixes it and the strip is gone -- so on an older
# SDK there is now nothing standing between that defect and the report, and the
# defect's whole character was that it failed SILENTLY and reported success.
# pip refusing to install is the only loud failure available here.
dependencies = ["nutrient-sdk>=1.0.11"]

[project.scripts]
costlab = "costlab.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
costlab = ["brand/*.css", "brand/*.svg", "corpus/*"]
